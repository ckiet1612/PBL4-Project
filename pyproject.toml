[project]
name = "nexa"
version = "0.1.0"
description = "Single-node multi-tenant batch AI platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.4,<1.19",
  "argon2-cffi>=25.1.0,<26",
  "fastapi>=0.141.1,<0.142",
  "psycopg[binary]>=3.3.5,<3.4",
  "rfc8785>=0.1.4,<0.2",
  "sqlalchemy>=2.0.54,<2.1",
  "typer>=0.27.2,<0.28",
  "uvicorn>=0.41.0,<0.42",
]

[project.scripts]
nexa-maintenance = "nexa.cli.main:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "hypothesis>=6.168.0,<7",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.8,<0.17",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

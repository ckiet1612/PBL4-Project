[project]
name = "nexa"
version = "0.1.0"
description = "Single-node multi-tenant batch AI platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.4,<1.19",
  "fastapi>=0.141.1,<0.142",
  "psycopg[binary]>=3.3.5,<3.4",
  "sqlalchemy>=2.0.54,<2.1",
  "typer>=0.27.2,<0.28",
]

[dependency-groups]
dev = [
  "hypothesis>=6.168.0,<7",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.8,<0.17",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

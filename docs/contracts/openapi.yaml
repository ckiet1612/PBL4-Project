      description: Maintenance-network, initial-deployment operation. It atomically creates one user and the first SYSTEM_ADMIN global grant only while no enabled system administrator exists and the admin-bootstrap window is open. Success permanently closes new admin bootstrap attempts; a completed same-key replay remains available without storing or returning the password. Later administrator changes use audited `/admin/users` operations.

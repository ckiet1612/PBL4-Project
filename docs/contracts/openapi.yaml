      properties: { callback_id: { $ref: '#/components/schemas/UuidV7' }, result_id: { $ref: '#/components/schemas/UuidV7' }, job_id: { $ref: '#/components/schemas/UuidV7' }, attempt_id: { $ref: '#/components/schemas/UuidV7' }, reserved_at: { $ref: '#/components/schemas/Timestamp' } }
    CheckpointPublishRequest: { type: object, additionalProperties: false, required: [authority, manifest_artifact_id, manifest], properties: { authority: { $ref: '#/components/schemas/Authority' }, manifest_artifact_id: { $ref: '#/components/schemas/UuidV7' }, manifest: { $ref: '#/components/schemas/CheckpointManifest' } } }
    CompleteRequest: { type: object, additionalProperties: false, required: [authority, result_manifest_artifact_id, manifest], properties: { authority: { $ref: '#/components/schemas/Authority' }, result_manifest_artifact_id: { $ref: '#/components/schemas/UuidV7' }, manifest: { $ref: '#/components/schemas/ResultManifest' } } }
    FailureClass: { type: string, enum: [INFRASTRUCTURE, TIMEOUT, OOM, INVALID_INPUT, INCOMPATIBLE, INTERNAL] }
    NoContainerProof:
      type: object
      additionalProperties: false
      required: [proof_type, startup_nonce, executor_operation_sequence, tombstone_sequence, observed_at, inspection_checksum]
      properties:
        proof_type: { type: string, const: NO_CONTAINER }
        startup_nonce: { $ref: '#/components/schemas/UuidV7' }
        executor_operation_sequence: { type: integer, format: int64, minimum: 1 }
        tombstone_sequence: { type: integer, format: int64, minimum: 1 }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        inspection_checksum: { $ref: '#/components/schemas/Checksum' }
    ContainerStoppedProof:
      type: object
      additionalProperties: false
      required: [proof_type, startup_nonce, executor_operation_sequence, container, stopped_at, exit_code, inspection_checksum]
      properties:
        proof_type: { type: string, const: CONTAINER_STOPPED }
        startup_nonce: { $ref: '#/components/schemas/UuidV7' }
        executor_operation_sequence: { type: integer, format: int64, minimum: 1 }
        container: { $ref: '#/components/schemas/ContainerIdentity' }
        stopped_at: { $ref: '#/components/schemas/Timestamp' }
        exit_code: { type: integer, minimum: -1, maximum: 255 }
        inspection_checksum: { $ref: '#/components/schemas/Checksum' }
    CleanupProof:
      oneOf: [ { $ref: '#/components/schemas/NoContainerProof' }, { $ref: '#/components/schemas/ContainerStoppedProof' } ]
      discriminator:
        propertyName: proof_type
        mapping:
          NO_CONTAINER: '#/components/schemas/NoContainerProof'
          CONTAINER_STOPPED: '#/components/schemas/ContainerStoppedProof'
    NoContainerFailureObservation:
      type: object
      additionalProperties: false
      required: [observation_type, proof]
      properties: { observation_type: { type: string, const: NO_CONTAINER }, proof: { $ref: '#/components/schemas/NoContainerProof' } }
    ContainerFailureObservation:
      type: object
      additionalProperties: false
      required: [observation_type, container, observed_at, exit_code, oom_killed, runtime_limit_reached]
      properties:
        observation_type: { type: string, const: CONTAINER }
        container: { $ref: '#/components/schemas/ContainerIdentity' }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        exit_code: { oneOf: [ { type: integer, minimum: -1, maximum: 255 }, { type: 'null' } ] }
        oom_killed: { type: boolean }
        runtime_limit_reached: { type: boolean }
    FailureObservation:
      oneOf: [ { $ref: '#/components/schemas/NoContainerFailureObservation' }, { $ref: '#/components/schemas/ContainerFailureObservation' } ]
      discriminator:
        propertyName: observation_type
        mapping:
          NO_CONTAINER: '#/components/schemas/NoContainerFailureObservation'
          CONTAINER: '#/components/schemas/ContainerFailureObservation'
    FailureRequest:
      type: object
      additionalProperties: false
      required: [authority, failure_class, reason_code, observation]
      properties:
        authority: { $ref: '#/components/schemas/Authority' }
        failure_class: { $ref: '#/components/schemas/FailureClass' }
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$', description: 'Allowlisted safe code only; never raw stderr, input, path, credential, SQL or checkpoint content.' }
        observation: { $ref: '#/components/schemas/FailureObservation' }
    WorkerAck: { type: object, additionalProperties: false, required: [callback_id, accepted, server_time, job_state, job_version], properties: { callback_id: { $ref: '#/components/schemas/UuidV7' }, accepted: { type: boolean }, server_time: { $ref: '#/components/schemas/Timestamp' }, job_state: { $ref: '#/components/schemas/JobState' }, job_version: { $ref: '#/components/schemas/Version' } } }
    CleanupRequest:
      type: object
      additionalProperties: false
      required: [worker_id, worker_incarnation_id, attempt_id, allocation_id, job_fence, proof]
      properties: { worker_id: { $ref: '#/components/schemas/UuidV7' }, worker_incarnation_id: { $ref: '#/components/schemas/UuidV7' }, attempt_id: { $ref: '#/components/schemas/UuidV7' }, allocation_id: { $ref: '#/components/schemas/UuidV7' }, job_fence: { type: integer, format: int64, minimum: 1 }, proof: { $ref: '#/components/schemas/CleanupProof' } }
    CleanupResponse: { type: object, additionalProperties: false, required: [callback_id, verified, allocation_state, server_time], properties: { callback_id: { $ref: '#/components/schemas/UuidV7' }, verified: { type: boolean }, allocation_state: { $ref: '#/components/schemas/AllocationState' }, server_time: { $ref: '#/components/schemas/Timestamp' } } }

  /attempts/{attempt_id}/claim:
    post:
      tags: [Worker]
      operationId: workerClaimAttempt
      summary: Confirm a dispatch offer for the exact worker incarnation
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: Claim acknowledgment and immutable execution context; replay returns the byte-equivalent context snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/ClaimResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/adopt:
    post:
      tags: [Worker]
      operationId: workerAdoptAttempt
      summary: Adopt an exact live managed container into the current worker incarnation
      description: During STARTING reconciliation only, the current incarnation may atomically transfer an exact live Attempt/Lease from the immediately prior incarnation when the prior Authority is still live, desired state permits continuation, and container ID plus runtime identity digest match the server record and local inspection. Under the same Job/Attempt/Lease/reservation locks, the commit appends the immutable prior-to-current Authority grant lineage and rebinds every still-active checkpoint/result reservation without changing reservation IDs, callback IDs, upload keys, Artifact responses or runner bindings; the response explicitly returns transferred reservations. A stable descriptor-key retry may recover a completed upload response from a lineage predecessor only after current-Authority authentication and exact attempt/allocation/lease/fence plus immutable upload-metadata match. Same adoption callback replays the original complete acknowledgment. Failed, expired, mismatched, local-runner-binding-conflicting, or response-too-late adoption never authorizes execution; the worker stops the container, reports failure/cleanup, and cannot report READY until resolved.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdoptRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: Adoption acknowledgment with new Authority and lease values., content: { application/json: { schema: { $ref: '#/components/schemas/AdoptResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/start:
    post:
      tags: [Worker]
      operationId: workerStartAttempt
      summary: Publish verified container identity and transition to RUNNING
      description: The first committed callback sets DB lease expiry to DB-now plus 45 seconds and stores that acknowledgment. The worker binds the callback's first send-monotonic instant and applies its candidate runner deadline only after a valid acknowledgment arrives before that deadline. Same-callback replay returns the original expiry without extending it; failed or delayed response never starts/rebases compute.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StartRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: Start acknowledgment with the initial lease deadline contract., content: { application/json: { schema: { $ref: '#/components/schemas/StartResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/renew:
    post:
      tags: [Worker]
      operationId: workerRenewAttempt
      summary: Renew a live attempt lease
      description: Before the first send for a callback ID the worker records that callback's immutable local send-monotonic instant. Before the first runner progress frame it sends the lease-only branch `progress_sequence=0, progress=null`, which leaves progress explicitly absent; afterward it sends sequence >=1 and the complete latest snapshot. It may apply `send_monotonic + lease_duration - safety_margin` to the runner only after receiving this valid acknowledgment before that candidate deadline. Failure, uncertainty, delayed response, and same-callback replay never extend or rebase unconfirmed authority.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: Lease renewed using DB time., content: { application/json: { schema: { $ref: '#/components/schemas/RenewResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/checkpoint-reservations:
    post:
      tags: [Worker]
      operationId: workerReserveCheckpoint
      summary: Reserve a server-generated checkpoint identity and job sequence
      description: Under the Job lock, exact live Authority reserves a server-generated checkpoint ID and the next checkpoint sequence. Same callback replays the same reservation. At most one checkpoint reservation is RESERVED for an Attempt; exact publish commits it, deterministic publish rejection marks it REJECTED, an authority-revoking failure/control/reaper transaction marks it ABANDONED, and successful adoption rebinds it before another can become active. The reservation is immutable input to the manifest and publish callback; abandonment never creates a committed/restorable Checkpoint and never permits a later manifest to reuse the identity for different content.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRequest' } } } }
      responses: { '201': { description: Checkpoint identity/sequence reserved., content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointReservation' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '500': { $ref: '#/components/responses/InternalError' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/checkpoints:
    post:
      tags: [Worker]
      operationId: workerPublishCheckpoint
      summary: Fence and commit checkpoint metadata after durable blob upload
      description: |
        The manifest checkpoint ID and sequence must equal an uncommitted
        reservation returned by `workerReserveCheckpoint` for this Authority.
        `manifest_artifact_id` must resolve to a committed same-tenant,
        same-attempt `CHECKPOINT_MANIFEST` whose canonical checksum and embedded
        manifest match the request. Every file reference is checked for exact
        artifact ID, kind `CHECKPOINT_FILE`, checksum and size. A batch-inference
        checkpoint must also reference a committed same-attempt
        `CHUNK_OUTPUT_MANIFEST`; its referenced chunks become GC-reachable through
        the checkpoint. That manifest is published by the current attempt, while
        individual chunk entries may carry forward committed outputs from prior
        attempts of the same tenant/job/logical session only when source attempt,
        source fence and recognized `(job_id, chunk_id)` all match. In the publish
        transaction, current-Authority chunks atomically insert-or-verify immutable
        recognized rows; prior-attempt chunks require an existing exact row.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointPublishRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '201': { description: Checkpoint metadata committed., content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRecord' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/artifacts:
    post:
      tags: [Worker]
      operationId: workerUploadAttemptArtifact
      summary: Stream an attempt-scoped checkpoint, result, or log artifact
      description: The worker supplies full live Authority in headers; cleanup-only authority cannot upload. `application/octet-stream` is the uniform transport and required `X-Artifact-Media-Type` carries validated original media metadata. Idempotency hashes declared media type, size/checksum, artifact kind, normalized attempt path and the full Authority tuple, and current credential/incarnation/live authority are rechecked before replay. The only cross-incarnation replay is a completed upload whose stored Authority is a verified predecessor of current Authority for the same Attempt after successful adoption; attempt/allocation/lease/fence and immutable upload metadata must still match exactly. `X-Artifact-Size` is exact and must equal Content-Length when present or the final chunked byte count. Bytes become a committed Artifact only after the durable blob sequence and metadata commit; interruption/mismatch returns 422 and leaves only expiring staging. The successful or replayed `201 Artifact` response is the sole source of the committed artifact ID/kind/media type/size/checksum binding returned to the trusted runner before it creates a final checkpoint/result manifest.
      security: [ { workerBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ArtifactChecksum'
        - $ref: '#/components/parameters/ArtifactSize'
        - $ref: '#/components/parameters/AttemptArtifactKindHeader'
        - $ref: '#/components/parameters/ArtifactMediaTypeHeader'
        - $ref: '#/components/parameters/WorkerIdHeader'
        - $ref: '#/components/parameters/WorkerIncarnationIdHeader'
        - $ref: '#/components/parameters/AllocationIdHeader'
        - $ref: '#/components/parameters/LeaseIdHeader'
        - $ref: '#/components/parameters/JobFenceHeader'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Durable attempt-scoped artifact committed; publish still requires a separate fenced callback.
          headers: { Location: { schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /attempts/{attempt_id}/result-reservations:
    post:
      tags: [Worker]
      operationId: workerReserveResult
      summary: Reserve the server-generated identity for the unique final result
      description: Exact live Authority reserves one immutable server-generated result ID for its Attempt. Same callback replays the same reservation; a distinct reservation under the same live Authority conflicts. Successful incarnation adoption of that same Attempt atomically rebinds the active reservation to the new Authority and returns it in the adoption response without changing its ID/callback. After Authority is otherwise revoked and no Result exists, only a later authorized Attempt may supersede the abandoned reservation with a new server ID under the Job lock. Abandonment never creates a recognized Result, and completion must present the currently active reservation ID.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRequest' } } } }
      responses: { '201': { description: Final result identity reserved., content: { application/json: { schema: { $ref: '#/components/schemas/ResultReservation' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '500': { $ref: '#/components/responses/InternalError' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/complete:
    post:
      tags: [Worker]
      operationId: workerCompleteAttempt
      summary: Fence and recognize the unique final result
      description: |
        The manifest result ID must equal the live job reservation returned by
        `workerReserveResult` for this Authority.
        `result_manifest_artifact_id` must resolve to a committed same-tenant,
        same-attempt `RESULT_MANIFEST` whose canonical checksum and embedded
        manifest match the request. Every file reference is checked for exact
        artifact ID, kind `RESULT_FILE`, checksum and size. Batch inference
        additionally requires the referenced same-attempt `CHUNK_OUTPUT_MANIFEST`;
        the API validates sorted non-overlapping ranges and full dataset coverage
        before recognizing the unique final result. Chunk entries may reference
        prior attempts only within the same tenant/job/logical session and must
        bind exact source attempt/fence plus recognized `(job_id, chunk_id)`.
        Current-Authority chunks atomically insert-or-verify recognized rows,
        prior-attempt chunks require existing exact rows, and the complete
        cross-attempt reference graph is retained for GC.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: Completion/result acknowledgment; callback replay returns the same record., content: { application/json: { schema: { $ref: '#/components/schemas/WorkerAck' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/execution-artifacts/{artifact_id}/content:
    get:
      tags: [Worker]
      operationId: workerDownloadExecutionArtifact
      summary: Download an artifact from the exact claimed execution graph
      description: This worker-only data route accepts full live Authority in headers and returns bytes only when the artifact is an immutable input, model, dataset, or committed restore-checkpoint file referenced by the ClaimResponse execution graph for this exact Attempt. It has no tenant-listing semantics, never accepts a filesystem path, and cannot read arbitrary same-tenant artifacts. Authority, graph membership, checksum and current credential/incarnation are rechecked on every request.
      security: [ { workerBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/WorkerIdHeader'
        - $ref: '#/components/parameters/WorkerIncarnationIdHeader'
        - $ref: '#/components/parameters/AllocationIdHeader'
        - $ref: '#/components/parameters/LeaseIdHeader'
        - $ref: '#/components/parameters/JobFenceHeader'
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=[0-9]+-[0-9]*$' }
      responses:
        '200': { description: Complete immutable artifact bytes., headers: { ETag: { $ref: '#/components/headers/ChecksumETag' }, X-Artifact-Media-Type: { schema: { type: string, minLength: 1, maxLength: 127 } }, Content-Length: { schema: { type: integer, minimum: 0 } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '206': { description: Single byte range., headers: { ETag: { $ref: '#/components/headers/ChecksumETag' }, X-Artifact-Media-Type: { schema: { type: string, minLength: 1, maxLength: 127 } }, Content-Range: { schema: { type: string } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /attempts/{attempt_id}/fail:
    post:
      tags: [Worker]
      operationId: workerFailAttempt
      summary: Fence and commit a classified attempt failure before cleanup
      description: The exact live Authority and typed observation are rechecked. A post-create observation binds exact container identity; a pre-create observation carries `NoContainerProof` backed by startup nonce and executor tombstone. The callback atomically stores the failure and safe reason code, revokes the lease, increments the job fence, moves the job to RECOVERING and the allocation to QUARANTINED, and records the replay acknowledgment. No allocation is released until separate proof-based cleanup; same callback ID and payload replays the original acknowledgment, while stale or payload-mismatched callbacks return 409.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FailureRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: Failure committed and authority fenced; callback replay returns the same acknowledgment., content: { application/json: { schema: { $ref: '#/components/schemas/WorkerAck' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
  /attempts/{attempt_id}/cleanup:
    post:
      tags: [Worker]
      operationId: workerReportCleanup
      summary: Prove no container exists or the exact container stopped so allocation may be released
      description: Cleanup authentication is separate from renew/publish authority and remains valid for the revoked attempt identity; it cannot publish data or revive the lease. `NoContainerProof` must bind a tombstoned startup nonce/sequence with no create in flight; `ContainerStoppedProof` binds the exact runtime identity.
      security: [ { workerBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/CallbackId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CleanupRequest' } } } }
      responses: { '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' }, '200': { description: 'Cleanup accepted and allocation released, or replay of that acknowledgment.', content: { application/json: { schema: { $ref: '#/components/schemas/CleanupResponse' } } } }, '202': { description: Proof recorded but reconcile must still verify absence; allocation remains quarantined., content: { application/json: { schema: { $ref: '#/components/schemas/CleanupResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '503': { $ref: '#/components/responses/DependencyUnavailable' } }
components:
  securitySchemes:
    browserCookie: { type: apiKey, in: cookie, name: nexa_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    cliBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-cli-token
      description: Exact non-hierarchical scopes. `jobs:read` authorizes template/job/session/event/log/result reads; `jobs:write` authorizes submit, sweep and job control; `artifacts:read` authorizes tenant artifact list/download; `artifacts:write` authorizes tenant upload; `tokens:write` authorizes only the caller's token list/create/revoke; `admin:read` and `admin:write` authorize SYSTEM_ADMIN reads and mutations. Current-principal introspection accepts any otherwise-valid token. No scope bypasses membership, ownership, global grant, CSRF, tenant context or object-state checks.
    workerBearer: { type: http, scheme: bearer, bearerFormat: opaque-worker-token }
    bootstrapSecret: { type: apiKey, in: header, name: X-Nexa-Bootstrap-Secret }
  headers:
    RequestId: { description: Correlation ID., schema: { $ref: '#/components/schemas/UuidV7' } }
    ETag: { description: Strong version ETag., schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    ChecksumETag: { description: Strong blob checksum ETag., schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' } }
    RetryAfter: { description: Minimum whole seconds before retry., schema: { type: integer, minimum: 1 } }
  parameters:
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, minLength: 16, maxLength: 2048 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    TenantContext: { name: X-Nexa-Tenant-Id, in: header, required: true, description: Explicit tenant context; active membership/role/scope is rechecked and cursors/idempotency are bound to this value., schema: { $ref: '#/components/schemas/UuidV7' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: 'Replay scope is operation-specific and closed by the contract to tenant UUID, GLOBAL, BOOTSTRAP, WORKER identity, or an Authority-resolved tenant for worker upload; callback operations use X-Callback-Id instead.', schema: { type: string, pattern: '^[!-~]{16,128}$' } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    CallbackId: { name: X-Callback-Id, in: header, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    WorkerIdHeader: { name: X-Worker-Id, in: header, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    WorkerIncarnationIdHeader: { name: X-Worker-Incarnation-Id, in: header, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    AllocationIdHeader: { name: X-Allocation-Id, in: header, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    LeaseIdHeader: { name: X-Lease-Id, in: header, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    JobFenceHeader: { name: X-Job-Fence, in: header, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ArtifactChecksum: { name: X-Artifact-Checksum, in: header, required: true, schema: { $ref: '#/components/schemas/Checksum' } }
    ArtifactSize: { name: X-Artifact-Size, in: header, required: true, description: Exact streamed byte count; must equal Content-Length when present and final received bytes for chunked transfer., schema: { type: integer, format: int64, minimum: 0, maximum: 1099511627776 } }
    ArtifactMediaTypeHeader: { name: X-Artifact-Media-Type, in: header, required: true, description: 'Original artifact media type stored as immutable metadata; transport remains application/octet-stream. It participates in idempotency hashing, must match the artifact-kind allowlist at upload, and is rechecked against template/manifest rules when referenced or published.', schema: { type: string, minLength: 1, maxLength: 127, pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+(?:;[A-Za-z0-9!#$&^_.+;= -]+)?$' } }
    UserArtifactKindHeader: { name: X-Artifact-Kind, in: header, required: true, description: Tenant upload kind; declaration does not bypass template/model allowlist validation., schema: { $ref: '#/components/schemas/UserArtifactKind' } }
    AttemptArtifactKindHeader: { name: X-Artifact-Kind, in: header, required: true, description: Attempt-scoped output kind; full live Authority is still required., schema: { $ref: '#/components/schemas/AttemptArtifactKind' } }
    JobId: { name: job_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    SessionId: { name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    AttemptId: { name: attempt_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    ArtifactId: { name: artifact_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    TokenId: { name: token_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    TenantId: { name: tenant_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    UserId: { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    WorkerId: { name: worker_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    SweepId: { name: sweep_id, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }
    TemplateId: { name: template_id, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
    FromTimestamp: { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/Timestamp' } }
    ToTimestamp: { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/Timestamp' } }
    BucketSeconds: { name: bucket_seconds, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 86400 } }
  responses:
    BadRequest: { description: 'Malformed body, duplicate JSON member, unknown field, filter, or cursor.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: 'Missing, invalid, expired, or revoked credential.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 'Authenticated principal lacks role/scope, tenant membership/context, or CSRF proof.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource absent or not visible in the authenticated tenant scope., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 'Idempotency key mismatch/in-progress, one-time secret already delivered, callback ID replayed with a different payload, committed state conflict, stale execution authority, or unique conflict. The ErrorResponse code identifies the case. Retry-After is present and equals 1 only for idempotency_in_progress; Location is present only for one_time_secret_unavailable.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' }, Retry-After: { $ref: '#/components/headers/RetryAfter' }, Location: { schema: { type: string, format: uri-reference } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PreconditionFailed: { description: If-Match does not equal the current version., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PreconditionRequired: { description: Required If-Match header is absent., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PayloadTooLarge: { description: Declared or streamed bytes exceed a configured hard limit., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationFailed: { description: 'Typed request validation, declared-size, or checksum validation failed.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Infeasible: { description: Request cannot fit total capacity/quota or lacks a configured capability., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited: { description: Durable user/tenant rate or outstanding-job quota exceeded., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' }, Retry-After: { $ref: '#/components/headers/RetryAfter' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    DependencyUnavailable: { description: 'Queue full, DB/schema/storage/capability/reconciliation dependency unavailable, or storage pressure.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' }, Retry-After: { $ref: '#/components/headers/RetryAfter' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    InternalError: { description: 'Unexpected server failure after safe rollback or fail-closed handling; no credential, path, input, checkpoint, SQL, or cross-tenant data is exposed.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    AcceptedJob: { description: Control transition committed., headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
  schemas:
    UuidV7: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
    Timestamp: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$' }
    Checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    Version: { type: integer, format: int64, minimum: 1 }
    ErrorCode: { type: string, enum: [authentication_required, invalid_csrf, permission_denied, resource_not_found, validation_failed, invalid_cursor, idempotency_conflict, idempotency_in_progress, one_time_secret_unavailable, precondition_required, version_conflict, state_conflict, infeasible_request, rate_limited, quota_exceeded, queue_full, dependency_unavailable, checksum_mismatch, payload_too_large, storage_pressure, stale_authority, lease_expired, callback_replayed, internal_error] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, minLength: 1, maxLength: 256 }
        request_id: { $ref: '#/components/schemas/UuidV7' }
    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, page_size]
      properties:
        next_cursor: { type: [string, 'null'], maxLength: 2048 }
        page_size: { type: integer, minimum: 0, maximum: 100 }
    Role: { type: string, enum: [MEMBER, TENANT_ADMIN] }
    SystemRole: { type: string, enum: [SYSTEM_ADMIN] }
    Membership:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, role, created_at, updated_at]
      properties:
        tenant_id: { $ref: '#/components/schemas/UuidV7' }
        user_id: { $ref: '#/components/schemas/UuidV7' }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    LoginRequest:
      type: object
      additionalProperties: false

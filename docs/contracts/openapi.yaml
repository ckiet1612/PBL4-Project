openapi: 3.1.0
info:
  title: Nexa REST API
  version: 1.0.0-b01
  summary: Single-node multi-tenant batch AI control plane
  license:
    name: License not declared by B01
    identifier: LicenseRef-Nexa-Unspecified
  description: |
    Contract for browser, CLI, administrator, coordinator-facing worker, and
    local bootstrap operations. Authorization, state transitions, transaction
    semantics, and failure handling are normative in the linked B01 contract
    documents. CLI scopes are exact, non-hierarchical permissions: jobs:read
    covers template/job/session/event/log/result reads; jobs:write covers submit,
    sweep and job controls; artifacts:read and artifacts:write cover tenant
    artifact reads and uploads; tokens:write covers only the caller's token
    metadata lifecycle; admin:read and admin:write cover SYSTEM_ADMIN read and
    mutation operations respectively. Role, tenant membership, ownership, CSRF
    and live authority checks remain mandatory in addition to scope. Unknown
    request fields and duplicate JSON members are rejected.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://nexa.example/v1
    description: Deployment-local TLS endpoint; hostname is configuration.
tags:
  - name: Auth
    description: Browser sessions and scoped CLI tokens.
  - name: Templates
    description: Allowlisted managed workload catalog.
  - name: Artifacts
    description: Bounded immutable artifact upload and tenant-owned download.
  - name: Jobs
    description: Job, logical session, attempts, checkpoints, events, logs, results, and controls.
  - name: Sweeps
    description: Finite sweep parent and per-child admission outcomes.
  - name: Admin
    description: Audited system-administrator identity, policy, worker, fairness, recovery, and audit operations.
  - name: Worker
    description: Worker-scoped dispatch, lease, publish, and cleanup callbacks.
  - name: Bootstrap
    description: Maintenance-network bootstrap for the initial system administrator and configured local worker.
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginBrowserSession
      summary: Create an opaque browser session
      description: In WRITE_FROZEN this remains available only for an existing enabled user with an active SYSTEM_ADMIN grant; the transaction may update the login rate counter and append session/audit metadata but cannot mutate workload, artifact, policy other than guarded recovery, allocation, ledger, membership, or credential state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: an@example.test, password: correct-horse-battery-staple }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Authenticated session; sets `nexa_session` Secure/HttpOnly/SameSite=Lax cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Revoke the current browser session
      security:
        - browserCookie: []
          csrfToken: []
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '204': { description: The authenticated session was revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getBrowserSession
      summary: Read the current browser session and memberships
      security:
        - browserCookie: []
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Current non-revoked session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /tokens:
    get:
      tags: [Auth]
      operationId: listCliTokens
      summary: List metadata for the caller's CLI tokens
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/PageSize' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Token metadata ordered by `created_at DESC, token_id DESC`; opaque values are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Auth]
      operationId: createCliToken
      summary: Create an expiring scoped CLI token
      description: Browser calls require CSRF; bearer callers need `tokens:write` scope. The opaque token is returned once and is never persisted in replay material. Same-key replay after commit returns `409 one_time_secret_unavailable` plus the token metadata Location; use a new key only after revoking the unknown token.
      security:
        - browserCookie: []
          csrfToken: []
        - cliBearer: []
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreateRequest' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '201':
          description: Token committed.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tokens/{token_id}:
    delete:
      tags: [Auth]
      operationId: revokeCliToken
      summary: Revoke one token owned by the caller
      security:
        - browserCookie: []
          csrfToken: []
        - cliBearer: []
      parameters:
        - $ref: '#/components/parameters/TokenId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '204': { description: Revoked or already revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /templates:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List template versions visible to the principal
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - name: enabled
          in: query
          schema: { type: boolean, default: true }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Allowlisted templates and typed parameter definitions.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /templates/{template_id}:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Get one allowlisted template version
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/TemplateId' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Template contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /artifacts:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List committed input/result artifacts owned by the active tenant
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ArtifactKind' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Keyset page ordered by `created_at DESC, id DESC`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Artifacts]
      operationId: uploadArtifact
      summary: Stream and commit an immutable tenant artifact
      description: '`application/octet-stream` is the uniform transport. `X-Artifact-Media-Type` carries the original media type and is validated against the artifact-kind allowlist here; submit/template validation rechecks that committed Artifact against the selected immutable template. `X-Artifact-Size` is the exact streamed byte count. Idempotency hashes declared media type, size, checksum and `X-Artifact-Kind`; tenant context is part of the replay scope and authorization is rechecked before lookup. If Content-Length is present it must match; chunked transfer is allowed but remains bounded by the declared size. Early disconnect or size mismatch returns 422 and leaves only expiring staging. Content is checksum-verified, fsynced, atomically renamed, directory-fsynced, then metadata is committed.'
      security:
        - browserCookie: []
          csrfToken: []
        - cliBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ArtifactChecksum'
        - $ref: '#/components/parameters/ArtifactSize'
        - $ref: '#/components/parameters/UserArtifactKindHeader'
        - $ref: '#/components/parameters/ArtifactMediaTypeHeader'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Durable committed artifact.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /artifacts/{artifact_id}:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Artifacts]
      operationId: getArtifactMetadata
      summary: Read owned artifact metadata without exposing filesystem paths
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/ArtifactId' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Owned artifact metadata.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /artifacts/{artifact_id}/content:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Artifacts]
      operationId: downloadArtifact
      summary: Download an owned committed blob
      description: Ownership and reference authorization are rechecked for every request; redirects to raw filesystem paths are forbidden.
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=[0-9]+-[0-9]*$' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Complete bytes.
          headers:
            ETag: { $ref: '#/components/headers/ChecksumETag' }
            X-Artifact-Media-Type: { schema: { type: string, minLength: 1, maxLength: 127 } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: Single byte range.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ChecksumETag' }
            X-Artifact-Media-Type: { schema: { type: string, minLength: 1, maxLength: 127 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List tenant-owned jobs using keyset pagination
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/JobState' }
        - name: template_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: created_after
          in: query
          schema: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Jobs ordered by `created_at DESC, id DESC`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Jobs]
      operationId: submitJob
      summary: Commit one job and logical execution session
      description: Returns 202 only after input/template/capability/admission checks and the job/session/event/idempotency/counter transaction commit.
      security:
        - browserCookie: []
          csrfToken: []
        - cliBearer: []
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSubmitRequest' }
            example:
              spec:
                template_id: cpu-iterative
                template_version: 1
                input_artifact_id: 018f0d60-7b6a-7a21-9d82-1aa39c4f30b7
                resources: { cpu_millis: 1000, memory_bytes: 536870912, gpu_count: 0 }
                priority: 1
                runtime_limit_seconds: 120
                checkpoint_interval_seconds: 30
                parameters: { iterations: 100000, seed: 7, modulus: 1000000007 }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '202':
          description: Job accepted and durable.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Infeasible' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /jobs/{job_id}:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get tenant-owned job state and desired state
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Job representation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{session_id}:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: getLogicalSession
      summary: Get the logical execution session whose state is derived from its job
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Session identity and derived job state; clients cannot mutate session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{job_id}/attempts:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: listJobAttempts
      summary: List attempts for one owned job
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Attempts newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /jobs/{job_id}/checkpoints:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: listJobCheckpoints
      summary: List committed checkpoint metadata for one owned job
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Committed checkpoints; staging/orphans are never exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /jobs/{job_id}/events:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: listJobEvents
      summary: Read ordered durable events after a sequence
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: after_sequence
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: '#/components/parameters/PageSize'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Events ordered by `sequence ASC, id ASC`, maximum 100.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{job_id}/logs:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: readJobLogs
      summary: Read a bounded log byte range
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: attempt_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UuidV7' }
        - name: after_offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: max_bytes
          in: query
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 65536 }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: UTF-8-safe log chunks with a next byte offset; secrets/input/checkpoint bytes are prohibited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /jobs/{job_id}/progress:
    parameters: [ { $ref: '#/components/parameters/TenantContext' } ]
    get:
      tags: [Jobs]
      operationId: getJobProgress
      summary: Read the latest accepted progress for an owned job
      description: Progress is a closed present/absent union. A present snapshot belongs to one attempt and sequence; after recovery a new attempt may explicitly reflect rollback to an earlier committed checkpoint.
      security: [ { browserCookie: [] }, { cliBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '200':
          description: Latest accepted progress or explicit absence before an attempt reports progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }

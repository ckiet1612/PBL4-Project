      summary: Create and make current a server-generated worker process incarnation
      description: The authenticated configured worker calls this once after taking the local singleton and before heartbeat/reconciliation. Under the Worker row lock the server generates the incarnation ID, increments the monotonic incarnation sequence, marks the prior incarnation ended, makes the new incarnation current in STARTING, and records the idempotent response. Same key and process-start nonce replay the same response; a new committed incarnation makes callbacks from every older incarnation stale.

      description: The cursor is bound to worker identity and current STARTING incarnation. The worker drains all pages and reconciles exact startup/container identities before reporting `reconcile_complete=true`. A LIVE prior-incarnation item is not permission to continue compute; the new incarnation must complete `workerAdoptAttempt`, and only a timely valid adoption acknowledgment may update the existing runner deadline.
